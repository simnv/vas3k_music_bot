services:
 tgbot-api:
    image: aiogram/telegram-bot-api:latest
    restart: always
    environment:
      - TELEGRAM_API_ID
      - TELEGRAM_API_HASH
      - TELEGRAM_LOCAL
      # - TELEGRAM_VERBOSITY
    networks:
      - tg
 music:
    build:
      dockerfile: ./Dockerfile
      context: .
    restart: always
    volumes:
      - data:/data
      - ./cookies.txt:/cookies.txt
    environment:
      - TELEGRAM_API_TOKEN
      - TELEGRAM_BOT_USERNAME
      - TELEGRAM_BASE_SCHEMA
      - TELEGRAM_BASE_URL
      - TELEGRAM_BASE_PORT
      - YTDL_LOCATION
      - ERROR_NOTIFICATION_TELEGRAM_ID
      - YTDL_PROXY
      - YTDL_PROXY_URL_CONTAINS
      - TELEGRAM_ALLOW_LIST
      - CHUNK_SIZE_MB
      - IPV6_URL_CONTAINS
      - JOB_MARKER_DIR
      - MAX_CONCURRENT_DOWNLOADS
      - MAX_CONCURRENT_DOWNLOADS_PER_CHAT
      # All optional. Without them the bot resolves music links itself.
      - ODESLI_API_KEY
      - SPOTIFY_CLIENT_ID
      - SPOTIFY_CLIENT_SECRET
    depends_on:
      - tgbot-api
    networks:
      - tg

volumes:
  data:

networks:
  tg:
